[package]
name = "hvkit"
description = "Patching and media tools for running Windows NT 5.x on Hyper-V Generation 2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["hive", "iso", "setup-cd", "setup-dvd"]
# Registry hives through hivex (LGPL-2.1, linked dynamically), on Windows through offreg.dll.
hive = ["dep:hive", "dep:regex"]
# Mastering ISO images through libisofs (GPL-2.0-or-later, linked dynamically): a binary built with it
# is under the GPL, so published builds leave it out.
iso = ["dep:iso"]
# Changing an installed system offline: inject, migrate (hives, no ISO mastering).
inject = ["hive", "dep:media"]
# Windows NT 5.x setup CDs, the CSMWrap CD, the Windows 98 disk (all of the above).
setup-cd = ["inject", "iso", "media/iso"]
# Windows NT 6.x setup DVDs: their Windows images through wim (LGPL-2.1-or-later OR GPL-3.0-or-later),
# so published builds leave it out with iso.
setup-dvd = ["inject", "iso", "media/setup-dvd"]

[dependencies]
recipes.workspace = true
formats.workspace = true
disk.workspace = true
fatfs.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hive = { workspace = true, optional = true }
iso = { workspace = true, optional = true }
media = { workspace = true, optional = true }
regex = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
