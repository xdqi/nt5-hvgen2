[package]
name = "hive"
description = "Offline Windows registry hives through hivex (offreg.dll on Windows), with .reg import and export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
links = "hivex"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Wdk_System_OfflineRegistry", "Win32_Foundation", "Win32_Security"] }
