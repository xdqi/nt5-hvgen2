[package]
name = "media"
description = "Installation media and offline changes: Windows NT 5.x setup CDs for Hyper-V Generation 2, installed systems moved there"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
disk.workspace = true
fatfs.workspace = true
formats.workspace = true
recipes.workspace = true
