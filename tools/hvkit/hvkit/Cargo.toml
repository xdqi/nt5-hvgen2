[package]
name = "hvkit"
description = "Patching and media tools for running Windows NT 5.x on Hyper-V Generation 2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["hive"]
# Registry hives through hivex (LGPL-2.1, linked dynamically).
hive = ["dep:hive", "dep:regex"]

[dependencies]
recipes.workspace = true
hive = { workspace = true, optional = true }
regex = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
