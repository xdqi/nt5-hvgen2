[workspace]
resolver = "3"
members = ["crates/formats", "crates/hive", "crates/iso", "crates/recipes", "hvkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
formats = { path = "crates/formats" }
hive = { path = "crates/hive" }
iso = { path = "crates/iso" }
recipes = { path = "crates/recipes" }
sha2 = "0.10"
